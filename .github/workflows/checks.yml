name: Checks
on:
  pull_request:
  push:
    branches: [main, feat/c/api-frontend]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.4.0
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FALKORDB_AVAILABLE: "1"
      FALKORDB_HOST: "127.0.0.1"
      FALKORDB_PORT: "6379"
      FALKORDB_GRAPH_NAME: weave_ci_${{ github.run_id }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Application lint and formatting
        run: |
          uv run ruff check src/weave_brain/api src/weave_brain/core src/weave_brain/services tests/unit/test_api.py
          uv run ruff format --check src/weave_brain/api src/weave_brain/core src/weave_brain/services tests/unit/test_api.py
      - name: Unit and live database regression tests
        run: uv run pytest tests/ -v
      - name: Repository lint
        if: always()
        run: uv run ruff check .
      - name: Repository formatting
        if: always()
        run: uv run ruff format --check .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          python-version: "3.12"
      - run: uv sync --frozen --project ../backend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
